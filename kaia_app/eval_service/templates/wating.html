<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>평가 완료</title>
    <style>
        /* 전체 화면 중앙 정렬 */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 카드 박스 */
        .success-container {
            background-color: #ffffff;
            padding: 40px 48px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        /* 체크 아이콘 느낌 */
        .icon-check {
            width: 56px;
            height: 56px;
            margin: 0 auto 18px;
            border-radius: 50%;
            border: 3px solid #800020;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #800020;
            box-sizing: border-box;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #222;
        }

        .message {
            font-size: 14px;
            color: #666;
            margin-bottom: 26px;
            line-height: 1.6;
        }

        .main-btn {
            display: inline-block;
            padding: 11px 26px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background-color: #800020;
            border: none;
            border-radius: 999px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .main-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(47, 111, 237, 0.35);
        }

        .sub-text {
            margin-top: 10px;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="icon-check">✓</div>
        <div class="title">평가 신청이 완료되었습니다.</div>
        <p class="message">
            평가 결과는 [평가 결과 확인]란에서 확인하실 수 있습니다.
        </p>
        <a href="{% url 'main' %}" class="main-btn">메인 화면으로 돌아가기</a>

    </div>
</body>
</html>
