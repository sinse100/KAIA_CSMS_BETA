{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 페이지</title>
    
    <link rel="stylesheet" href="{% static 'css/login.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/base.css' %}" type="text/css">
    <link rel="shortcut icon" href="{% static 'image/favicon.ico' %}"/>
</head>
<body>

    {% include "base.html" %}

    <main>
        <div class="login-container">
            <h1>로그인</h1>
            <p class="subtitle">다른 서비스로 로그인</p>
            <div class="social-login">
                <a href="#" onclick="alert('not implemented yet'); return false;" aria-label="Google로 로그인">
                    <img src="{% static 'img/google.png' %}" alt="Google">
                </a>
                <a href="#" onclick="alert('not implemented yet'); return false;" aria-label="Naver로 로그인">
                    <img src="{% static 'img/naver.png' %}" alt="Naver">
                </a>
                <a href="#" onclick="alert('not implemented yet'); return false;" aria-label="Kakao로 로그인">
                    <img src="{% static 'img/kakaotalk.png' %}" alt="KakaoTalk">
                </a>
                <a href="#" onclick="alert('not implemented yet'); return false;" aria-label="Facebook으로 로그인">
                    <img src="{% static 'img/facebook.png' %}" alt="Facebook">
                </a>
            </div>

            <form class="login-form" method="post" action='{% url "login" %}'>
                {% csrf_token %}
                
                <input type="text" placeholder="ID" name="username" required>
                <input type="password" placeholder="PW" name="password" required>
                
                <button type="submit" class="login-btn">로그인</button>
            </form>

            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember_session" checked>
                    <span>로그인 상태 유지</span>
                </label>
                
                <div class="links">
                    <a href="">아이디 찾기</a>
                    <span class="separator">|</span>
                    <a href="">비밀번호 재설정</a>
                    <span class="separator">|</span>
                    <a href="{% url 'signup' %}">회원가입</a>
                </div>
            </div>

        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
    </body>
</html>
